# Настройки Cloudflare Worker. Секреты сюда НЕ пишем — только через `wrangler secret put`.
name = "otves-leads"
main = "index.js"
compatibility_date = "2026-10-01"

# База заявок (Cloudflare D1, SQLite). В коде доступна как env.DB
# База создана: npx wrangler d1 create otves
[[d1_databases]]
binding = "DB"
database_name = "otves"
database_id = "016ddb0c-05b2-4101-9cb3-2246bedbb28a"
